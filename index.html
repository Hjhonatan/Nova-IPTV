<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0f">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https: http:; media-src * blob:; connect-src *; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <title>Nova IPTV</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/player.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M10 9.5v5l4.5-2.5z" fill="currentColor"/></svg>
        <span id="appName" class="brand-name">Nova IPTV</span>
      </div>
      <div class="top-actions">
        <span id="statusDot" class="status-dot" title="Sin lista"></span>
        <button id="btnSearch" class="icon-btn" aria-label="Buscar"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></button>
        <button id="btnSettings" class="icon-btn" aria-label="Ajustes"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
      </div>
    </header>

    <div id="searchBar" class="searchbar" hidden>
      <input id="searchInput" type="search" placeholder="Buscar canal…" autocomplete="off" enterkeyhint="search">
      <button id="searchClose" class="icon-btn" aria-label="Cerrar búsqueda"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>

    <main id="view" class="view" tabindex="-1"></main>

    <nav class="tabbar" aria-label="Navegación principal">
      <button data-tab="home" class="tab"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Inicio</span></button>
      <button data-tab="live" class="tab"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 21h8M12 17v4"/></svg><span>En vivo</span></button>
      <button data-tab="favorites" class="tab"><svg viewBox="0 0 24 24"><path d="M12 21s-7-4.4-9.3-9A5.3 5.3 0 0 1 12 6.6 5.3 5.3 0 0 1 21.3 12C19 16.6 12 21 12 21z"/></svg><span>Favoritos</span></button>
      <button data-tab="recent" class="tab"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>Recientes</span></button>
      <button data-tab="lists" class="tab"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg><span>Listas</span></button>
    </nav>
  </div>

  <!-- Reproductor -->
  <section id="player" class="player" hidden aria-label="Reproductor">
    <div id="playerStage" class="stage">
      <video id="video" playsinline preload="none"></video>
      <div id="spinner" class="spinner" hidden><i></i></div>
      <div id="errorBox" class="error-box" hidden>
        <p id="errorMsg"></p>
        <div class="row">
          <button id="btnRetry" class="btn primary">Reintentar</button>
          <button id="btnErrorDetail" class="btn ghost" hidden>Detalles técnicos</button>
        </div>
        <pre id="errorDetail" hidden></pre>
      </div>
      <div id="controls" class="controls">
        <div class="c-top">
          <button id="btnClose" class="icon-btn" aria-label="Cerrar reproductor"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
          <div class="c-title"><strong id="chName"></strong><small id="chGroup"></small></div>
          <button id="btnFavPlayer" class="icon-btn" aria-label="Favorito"><svg viewBox="0 0 24 24"><path d="M12 21s-7-4.4-9.3-9A5.3 5.3 0 0 1 12 6.6 5.3 5.3 0 0 1 21.3 12C19 16.6 12 21 12 21z"/></svg></button>
        </div>
        <div class="c-mid">
          <button id="btnPrev" class="icon-btn big" aria-label="Canal anterior"><svg viewBox="0 0 24 24"><path d="M6 5v14M19 5l-9 7 9 7z"/></svg></button>
          <button id="btnPlay" class="icon-btn huge" aria-label="Reproducir o pausar"><svg id="icoPlay" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg><svg id="icoPause" viewBox="0 0 24 24" hidden><path d="M7 4v16M17 4v16"/></svg></button>
          <button id="btnNext" class="icon-btn big" aria-label="Canal siguiente"><svg viewBox="0 0 24 24"><path d="M18 5v14M5 5l9 7-9 7z"/></svg></button>
        </div>
        <div class="c-bottom">
          <button id="btnMute" class="icon-btn" aria-label="Silenciar"><svg id="icoVol" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9zM16 8a5 5 0 0 1 0 8"/></svg><svg id="icoMute" viewBox="0 0 24 24" hidden><path d="M4 9v6h4l5 4V5L8 9zM17 9l5 6M22 9l-5 6"/></svg></button>
          <input id="volume" type="range" min="0" max="1" step="0.05" value="1" aria-label="Volumen">
          <span class="spacer"></span>
          <button id="btnFull" class="icon-btn" aria-label="Pantalla completa"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
        </div>
      </div>
    </div>
    <div id="playerInfo" class="player-info">
      <div id="epgNow" class="epg-now" hidden></div>
      <h3 class="section-title">Cambio rápido</h3>
      <div id="playerList" class="chan-list compact"></div>
    </div>
  </section>

  <div id="modal" class="modal" hidden><div class="modal-card" role="dialog" aria-modal="true"></div></div>
  <div id="toast" class="toast" hidden role="status"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
